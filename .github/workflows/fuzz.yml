# Nightly fuzzing: every target runs for a few minutes in the Nix dev shell, starting from
# the corpus earlier runs grew. A crash, hang or runaway allocation fails the job and its
# input is kept as an artifact; minimise it and save it under fixtures/fuzz/ (see the
# justfile `fuzz` recipe). See docs/development.md ("Fuzzing").
name: Fuzz

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "300"

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [dxf, gerber, svg, pdf, gds, ipc, pipeline]
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('flake.lock', 'rust-toolchain.toml', 'Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: fuzz-${{ runner.os }}-

      # The corpus only grows: restore the latest one and save a new one after each run.
      - uses: actions/cache@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: corpus-${{ matrix.target }}-

      - name: Fuzz
        run: nix develop -c just fuzz ${{ matrix.target }} ${{ inputs.seconds || '300' }}

      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30
