# Coverage-guided fuzz targets (cargo-fuzz / libFuzzer). Its own workspace: libFuzzer
# instrumentation flags must not leak into the main build. Run with `just fuzz <target>`.
[package]
name = "lvp-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lvp-core = { path = "../crates/lvp-core" }

[workspace]
members = ["."]

[[bin]]
name = "dxf"
path = "fuzz_targets/dxf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gerber"
path = "fuzz_targets/gerber.rs"
test = false
doc = false
bench = false

[[bin]]
name = "svg"
path = "fuzz_targets/svg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdf"
path = "fuzz_targets/pdf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gds"
path = "fuzz_targets/gds.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ipc"
path = "fuzz_targets/ipc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pipeline"
path = "fuzz_targets/pipeline.rs"
test = false
doc = false
bench = false

# Debug assertions and overflow checks everywhere except the kernel, whose debug-only
# self-checks fire on near-degenerate input its release build handles (see the root
# Cargo.toml). Set here, with `cargo fuzz -O`, because cargo-fuzz's own debug-assertion
# flag (its default without -O) applies to every crate.
[profile.release]
debug-assertions = true
overflow-checks = true

[profile.release.package.cavalier_contours]
debug-assertions = false
