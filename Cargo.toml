[workspace]
resolver = "3"
members = ["crates/lvp-core", "crates/lvp-wasm", "crates/lvp-fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
lvp-core = { path = "crates/lvp-core" }
# Pinned exactly: must equal the wasm-bindgen-cli version provided by flake.nix (nixpkgs).
wasm-bindgen = "=0.2.129"
# Default (bundler) helper: Vite emits its self-spawning pool worker as a separate chunk and
# resolves the glue through the package.json that `just wasm` writes next to it.
wasm-bindgen-rayon = "1.3"
rayon = "1.12"
cavalier_contours = "0.9"
proptest = "1.12"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
