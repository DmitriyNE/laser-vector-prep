[workspace]
resolver = "3"
members = ["crates/lvp-core", "crates/lvp-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
lvp-core = { path = "crates/lvp-core" }
# Pinned exactly: must equal the wasm-bindgen-cli version provided by flake.nix (nixpkgs).
wasm-bindgen = "=0.2.129"
proptest = "1.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
