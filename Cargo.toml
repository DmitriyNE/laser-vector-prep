[workspace]
resolver = "3"
members = ["crates/lvp-core", "crates/lvp-wasm", "crates/lvp-fixtures"]
# Its own workspace (libFuzzer instrumentation); see fuzz/Cargo.toml.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
lvp-core = { path = "crates/lvp-core" }
# Pinned exactly: must equal the wasm-bindgen-cli version provided by flake.nix (nixpkgs).
wasm-bindgen = "=0.2.129"
# Default (bundler) helper: Vite emits its self-spawning pool worker as a separate chunk and
# resolves the glue through the package.json that `just wasm` writes next to it.
wasm-bindgen-rayon = "1.3"
rayon = "1.12"
cavalier_contours = "0.9"
boostvoronoi = { version = "0.12", default-features = false }
proptest = "1.12"
# SVG semantics (CSS, use/symbol, viewBox, shapes to paths); text stays off (D22).
usvg = { version = "0.49", default-features = false }
# PDF object model (xref, object streams, filters); content-stream geometry is ours (D22).
lopdf = { version = "0.46", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JSON Schema of the profile format, derived from the same serde types (docs/profile-schema.json).
schemars = "1.2"
# Test-only: checks the presets against that schema.
jsonschema = { version = "0.60", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The kernel's debug-only self-checks fire on near-degenerate input (boundaries within its
# 10 nm tolerance) that its release build handles; our booleans detect what such input does
# to a result and report it (`Region::incomplete`). Same in fuzz/Cargo.toml.
[profile.dev.package.cavalier_contours]
debug-assertions = false
