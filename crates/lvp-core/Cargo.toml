[package]
name = "lvp-core"
description = "Laser Vector Prep geometry core: units, primitives, flattening, DXF writing. No browser or wasm dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
boostvoronoi.workspace = true
cavalier_contours.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
usvg.workspace = true

# boostvoronoi -> cpp_map -> rand -> getrandom: on wasm32 it needs the JS backend (see
# `.cargo/config.toml` for the matching --cfg flag).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
proptest.workspace = true
