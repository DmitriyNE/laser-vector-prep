[package]
name = "lvp-core"
description = "Laser Vector Prep geometry core: units, primitives, flattening, DXF writing. No browser or wasm dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
boostvoronoi.workspace = true
cavalier_contours.workspace = true
i_overlay.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
usvg.workspace = true
lopdf.workspace = true

# boostvoronoi -> cpp_map -> rand -> getrandom: on wasm32 it needs the JS backend (see
# `.cargo/config.toml` for the matching --cfg flag).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
# lopdf -> rand -> getrandom 0.4; same JS backend, same --cfg flag.
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
proptest.workspace = true
jsonschema.workspace = true
