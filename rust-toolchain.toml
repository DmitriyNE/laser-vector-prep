# Nightly is required for `-Z build-std`: the wasm32 std must be rebuilt with atomics for
# shared-memory wasm (see .cargo/config.toml and justfile `wasm`). Pinned by date; the Nix
# shell reads this same file (flake.nix) so rustup and Nix users get identical toolchains.
[toolchain]
channel = "nightly-2026-10-24"
components = ["rust-src", "rustfmt", "clippy", "rust-analyzer"]
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
